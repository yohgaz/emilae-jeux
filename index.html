// Onglet "in-game" simplifié : les jobs sont dans la bannière, il ne reste
// ici que les "faux onglets" hauts faits/montures/mascottes.
function renderFfxivIngame(d) {
  const pane = document.getElementById('jeu-detail-tab-ingame');
  if (!pane) return;
  _ffxivCurrentData = d;
  _ffxivActivePanel = null;
  pane.innerHTML = `
    <div class="ffxiv-triggers-row">
      <button class="ffxiv-trigger-btn" data-panel="hf" onclick="toggleFfxivPanel('hf')">🏆 Hauts faits</button>
      <button class="ffxiv-trigger-btn" data-panel="mounts" onclick="toggleFfxivPanel('mounts')">🐴 Montures (${(d.mounts || []).length})</button>
      <button class="ffxiv-trigger-btn" data-panel="minions" onclick="toggleFfxivPanel('minions')">🐾 Mascottes (${(d.minions || []).length})</button>
    </div>
    <div class="ffxiv-panel" id="ffxiv-panel-content"></div>`;
  toggleFfxivPanel('hf'); // les hauts faits obtenus s'ouvrent directement, pas besoin de cliquer
}

function toggleFfxivPanel(panel) {
  _ffxivActivePanel = (_ffxivActivePanel === panel) ? null : panel;
  document.querySelectorAll('.ffxiv-trigger-btn[data-panel]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.panel === _ffxivActivePanel);
  });
  const box = document.getElementById('ffxiv-panel-content');
  if (!box || !_ffxivCurrentData) return;
  if (!_ffxivActivePanel) { box.innerHTML = ''; return; }
  if (_ffxivActivePanel === 'mounts') box.innerHTML = ffxivCollectHtml(_ffxivCurrentData.mounts, 'Aucune monture récupérée.');
  else if (_ffxivActivePanel === 'minions') box.innerHTML = ffxivCollectHtml(_ffxivCurrentData.minions, 'Aucune mascotte récupérée.');
  else if (_ffxivActivePanel === 'hf') { box.innerHTML = `<div id="ffxiv-hf-section"></div>`; renderFfxivAchievements(); }
}

function ffxivCollectHtml(list, emptyLabel) {
  return (list && list.length)
    ? `<div class="ffxiv-collect-grid">${list.map(m => `<div class="ffxiv-collect-item">${m.icon ? `<img src="${esc(m.icon)}" alt="">` : ''}<span title="${esc(m.name)}">${esc(m.name)}</span></div>`).join('')}</div>`
    : `<div class="jeu-detail-empty">${emptyLabel}</div>`;
}

// ── Explorateur de succès par catégorie/liste — même composant que le
// panneau local (voir achievementExplorerHtml dans tasks-editor.html) :
// remplace le mur de vignettes/liste plate des seuls récemment obtenus par
// une vraie navigation par catégorie, obtenus ET non obtenus, avec une
// ligne des derniers débloqués au-dessus. FFXIV n'a que 2 colonnes
// (catégorie/liste) : pas de vraie sous-catégorie côté Lodestone.
const FFXIV_CATEGORY_ICON = {
  'Combats': '⚔️', 'JcJ': '🚩', 'Personnage': '🧑', 'Objets': '🎒',
  'Synthèse et récolte': '🛠️', 'Quêtes': '📜', 'Exploration': '🧭', 'Grandes compagnies': '🎖️'
};
function achExplorerCategoryIcon(name) { return FFXIV_CATEGORY_ICON[name] || '📖'; }
function jsStr(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

let _achExplorer = { achievements: [], groups: [], catId: null };
function achievementExplorerHtml(achievements, groups) {
  if (!achievements || !achievements.length) return `<div class="jeux-empty">Aucune donnée disponible.</div>`;
  const groupList = (groups && groups.length) ? groups : [{ id: 'default', name: 'Hauts faits' }];
  _achExplorer = { achievements, groups: groupList, catId: groupList[0].id };
  requestAnimationFrame(fitAchExplorerRecentRow);
  return `<div class="ach-explorer">${achExplorerRecentHtml()}<div id="ach-explorer-columns">${achExplorerColumnsHtml()}</div></div>`;
}
function fitAchExplorerRecentRow() {
  const row = document.querySelector('.ach-explorer-recent-row');
  if (!row || !row.children.length) return;
  const ITEM_WIDTH = 260, GAP = 12;
  const fitCount = Math.max(1, Math.floor((row.clientWidth + GAP) / (ITEM_WIDTH + GAP)));
  Array.from(row.children).slice(fitCount).forEach(el => el.remove());
}
function findAchExplorerGroupName(groupId) {
  const g = _achExplorer.groups.find(x => x.id === groupId);
  return g ? g.name : '';
}
function achExplorerRecentHtml() {
  const recent = _achExplorer.achievements
    .filter(a => a.earned && a.date)
    .sort((a, b) => (b.date || 0) - (a.date || 0))
    .slice(0, 20);
  if (!recent.length) return '';
  return `<div class="ach-explorer-recent">
    <div class="ach-explorer-recent-title">🕐 Derniers succès débloqués</div>
    <div class="ach-explorer-recent-row">${recent.map(a => `
      <div class="ach-explorer-recent-item" onclick="achExplorerJumpTo('${jsStr(a.groupId || 'default')}')">
        ${a.icon
          ? `<img class="ach-explorer-recent-icon-img" src="${esc(a.icon)}" alt="" onerror="this.outerHTML='<div class=&quot;ach-explorer-recent-icon&quot;>${achExplorerCategoryIcon(findAchExplorerGroupName(a.groupId))}</div>'">`
          : `<div class="ach-explorer-recent-icon">${achExplorerCategoryIcon(findAchExplorerGroupName(a.groupId))}</div>`}
        <div style="min-width:0">
          <div class="ach-explorer-recent-name">${esc(a.name)}${a.points ? `<span class="ach-explorer-ach-points">${a.points} pts</span>` : ''}</div>
          <div class="ach-explorer-recent-date">${new Date(a.date).toLocaleDateString('fr-FR')}</div>
        </div>
      </div>`).join('')}</div>
  </div>`;
}
function achExplorerJumpTo(catId) {
  _achExplorer.catId = catId;
  const box = document.getElementById('ach-explorer-columns');
  if (box) box.innerHTML = achExplorerColumnsHtml();
}
function achExplorerCategoryList() {
  return _achExplorer.groups.map(g => {
    const items = _achExplorer.achievements.filter(a => (a.groupId || 'default') === g.id);
    return { id: g.id, name: g.name, count: items.length, earned: items.filter(a => a.earned).length };
  }).filter(c => c.count > 0);
}
function achExplorerAchievementList() {
  return _achExplorer.achievements.filter(a => (a.groupId || 'default') === _achExplorer.catId);
}
function achExplorerColHtml(items, activeId) {
  return items.map(it => {
    const pct = it.count ? Math.round(it.earned / it.count * 100) : 0;
    return `<div class="ach-explorer-col-item ${it.id === activeId ? 'active' : ''}" onclick="selectAchExplorerCat('${jsStr(it.id)}')">
      <span class="ach-explorer-col-item-icon">${achExplorerCategoryIcon(it.name)}</span>
      <div style="flex:1;min-width:0">
        <div class="ach-explorer-col-item-name">${esc(it.name)}</div>
        <div class="ach-explorer-col-item-bar"><div class="ach-explorer-col-item-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <span class="ach-explorer-col-item-count">${it.earned}/${it.count}</span>
    </div>`;
  }).join('');
}
function achExplorerColumnsHtml() {
  const cats = achExplorerCategoryList();
  const list = achExplorerAchievementList();
  return `<div class="ach-explorer-columns" style="grid-template-columns:240px 1fr">
    <div class="ach-explorer-col">${achExplorerColHtml(cats, _achExplorer.catId)}</div>
    <div class="ach-explorer-col ach-explorer-col-list">${achExplorerAchievementListHtml(list)}</div>
  </div>`;
}
function achExplorerAchievementListHtml(list) {
  if (!list.length) return `<div class="jeux-empty">Aucun succès dans cette catégorie.</div>`;
  const sorted = list.slice().sort((a, b) => (b.earned ? 1 : 0) - (a.earned ? 1 : 0));
  return sorted.map(a => {
    const iconHtml = a.icon
      ? `<div class="ach-explorer-ach-icon-wrap">
          <img class="ach-explorer-ach-icon" src="${esc(a.icon)}" alt="" onerror="this.parentElement.outerHTML='<div class=&quot;ach-explorer-ach-badge ${a.earned ? 'earned' : 'locked'}&quot;>${a.earned ? '✓' : '🔒'}</div>'">
          <span class="ach-explorer-ach-icon-badge ${a.earned ? 'earned' : 'locked'}">${a.earned ? '✓' : '🔒'}</span>
        </div>`
      : `<div class="ach-explorer-ach-badge ${a.earned ? 'earned' : 'locked'}">${a.earned ? '✓' : '🔒'}</div>`;
    return `
    <div class="ach-explorer-ach-row ${a.earned ? 'earned' : 'locked'}">
      ${iconHtml}
      <div style="flex:1;min-width:0">
        <div class="ach-explorer-ach-name">${esc(a.name)}${a.points ? `<span class="ach-explorer-ach-points">${a.points} pts</span>` : ''}</div>
        ${a.description ? `<div class="ach-explorer-ach-desc">${esc(a.description)}</div>` : ''}
        ${a.earned && a.date ? `<div class="ach-explorer-ach-date">Obtenu le ${new Date(a.date).toLocaleDateString('fr-FR')}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}
function selectAchExplorerCat(catId) {
  _achExplorer.catId = catId;
  document.getElementById('ach-explorer-columns').innerHTML = achExplorerColumnsHtml();
}

function renderFfxivAchievements() {
  const section = document.getElementById('ffxiv-hf-section');
  if (!section || !_ffxivCurrentData) return;
  const a = _ffxivCurrentData.achievements || {};
  const head = `<div class="jeu-detail-section-head">🏆 Hauts faits${a.earned !== null && a.earned !== undefined ? ` — ${a.earned}${a.total ? ` / ~${a.total}` : ''}` : ''}${a.points ? ` · ${esc(a.points)}` : ''}</div>`;
  if (a.categories && a.categories.length) {
    const flat = [];
    a.categories.forEach(c => c.achievements.forEach(x => flat.push({ ...x, groupId: c.id })));
    const groups = a.categories.map(c => ({ id: c.id, name: c.name }));
    section.innerHTML = head + achievementExplorerHtml(flat, groups);
  } else {
    _ffxivHfList = (a.recent || []).slice().sort((x, y) => (y.date || 0) - (x.date || 0));
    section.innerHTML = `${head}<input type="text" class="ffxiv-hf-search" placeholder="Rechercher un haut fait..." oninput="filterFfxivHf(this.value)"><div id="ffxiv-hf-list">${ffxivHfRowsHtml(_ffxivHfList)}</div>`;
  }
}
function ffxivHfRowsHtml(list) {
  return list.length
    ? `<div class="ffxiv-hf-grid">${list.map(h => `<div class="ffxiv-hf-row">
        ${h.icon
          ? `<img class="ffxiv-hf-icon" src="${esc(h.icon)}" alt="" onerror="this.outerHTML='<div class=&quot;ffxiv-hf-icon&quot;>🏆</div>'">`
          : `<div class="ffxiv-hf-icon">🏆</div>`}
        <div class="ffxiv-hf-text">
          <div class="ffxiv-hf-name" title="${esc(h.name)}">${esc(h.name)}</div>
          <div class="ffxiv-hf-date">${h.date ? new Date(h.date).toLocaleDateString('fr-FR') : ''}${(h.date && h.points !== undefined && h.points !== null) ? ' · ' : ''}${(h.points !== undefined && h.points !== null) ? `${h.points} pts` : ''}</div>
        </div>
      </div>`).join('')}</div>`
    : `<div class="jeu-detail-empty">Aucun haut fait récupéré.</div>`;
}
function filterFfxivHf(q) {
  const box = document.getElementById('ffxiv-hf-list');
  if (!box) return;
  const qn = q.toLowerCase().trim();
  const filtered = qn ? _ffxivHfList.filter(h => h.name.toLowerCase().includes(qn)) : _ffxivHfList;
  box.innerHTML = filtered.length ? ffxivHfRowsHtml(filtered) : `<div class="jeu-detail-empty">Aucun résultat pour "${esc(q)}".</div>`;
}

function closeJeuDetailModal() {
  document.getElementById('modal-jeu-detail').classList.remove('open');
  document.body.style.overflow = '';
  if (document.documentElement.classList.contains('embed')) parent.postMessage({ type: 'fermer-jeu' }, '*');
}

// Où que la souris survole la popup (même la bannière/jaquette, fixes),
// la molette fait défiler la liste de succès/trophées — jamais la page
// derrière.
document.getElementById('modal-jeu-detail').addEventListener('wheel', (e) => {
  const feed = document.getElementById('jeu-detail-body');
  if (!feed) return;
  feed.scrollTop += e.deltaY;
  e.preventDefault();
}, { passive: false });

function achievementGridHtml(list, kind) {
  if (!list || !list.length) return `<div class="jeux-empty">Aucune donnée disponible.</div>`;
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>';
  const sorted = list.slice().sort((a, b) => (b.earned ? 1 : 0) - (a.earned ? 1 : 0));
  return `<div class="jeu-detail-ach-grid">${sorted.map(a => {
    const icon = kind === 'steam' ? (a.earned ? a.iconEarned : a.iconLocked) : a.icon;
    const secret = kind === 'psn' && a.hidden && !a.earned;
    const name = secret ? 'Trophée secret' : (a.name || '');
    const desc = secret ? "Débloque-le pour découvrir de quoi il s'agit." : (a.description || '');
    const iconHtml = icon
      ? `<img src="${esc(icon)}" alt="" onerror="this.style.visibility='hidden'">`
      : (kind === 'switch' ? `<div class="jeu-detail-ach-noicon">🏆</div>` : `<img src="" alt="" style="visibility:hidden">`);
    return `<div class="jeu-detail-ach ${a.earned ? 'earned' : 'locked'}">
      <div class="jeu-detail-ach-icon-wrap">
        ${iconHtml}
        <span class="jeu-detail-ach-badge ${a.earned ? 'earned' : 'locked'}" title="${a.earned ? 'Obtenu' : 'Verrouillé'}">${a.earned ? CHECK_SVG : LOCK_SVG}</span>
      </div>
      <div class="jeu-detail-ach-text">
        <div class="jeu-detail-ach-name">${esc(name)}${kind === 'psn' && a.type ? ` <span style="color:var(--mu)">· ${esc(a.type)}</span>` : ''}</div>
        <div class="jeu-detail-ach-desc">${esc(desc)}</div>
      </div>
      ${typeof a.points === 'number' ? `<span class="jeu-detail-ach-points">${a.points} G</span>` : ''}
    </div>`;
  }).join('')}</div>`;
}

// Regroupement des trophées PSN par extension — grille de cartes cliquables
// (icône officielle Sony par groupe), même geste que les jaquettes de jeux.
let _psnGroupsData = { trophies: [], groups: [] };
function psnTrophyGroupsHtml(trophies, groups) {
  if (!trophies || !trophies.length) return `<div class="jeux-empty">Aucune donnée disponible.</div>`;
  const groupList = (groups && groups.length) ? groups : [{ id: 'default', name: 'Trophées' }];
  _psnGroupsData = { trophies, groups: groupList };
  return `<div class="psn-group-grid">${groupList.map(g => {
    const groupTrophies = trophies.filter(t => (t.groupId || 'default') === g.id);
    if (!groupTrophies.length) return '';
    const earnedCount = groupTrophies.filter(t => t.earned).length;
    const pct = Math.round(earnedCount / groupTrophies.length * 100);
    return `<div class="psn-group-card" onclick="openPsnGroupModal('${esc(g.id)}')">
      <div class="psn-group-card-cover">${g.icon ? `<img src="${esc(g.icon)}" alt="" onerror="this.style.visibility='hidden'">` : ''}</div>
      <div class="psn-group-card-overlay">
        <div class="psn-group-card-name">${esc(g.name)}</div>
        <div class="psn-group-card-progress">${earnedCount}/${groupTrophies.length} · ${pct}%</div>
        <div class="psn-group-card-bar"><div class="psn-group-card-bar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function openPsnGroupModal(groupId) {
  const g = _psnGroupsData.groups.find(x => x.id === groupId);
  const groupTrophies = _psnGroupsData.trophies.filter(t => (t.groupId || 'default') === groupId);
  if (!g) return;
  const earnedCount = groupTrophies.filter(t => t.earned).length;
  document.getElementById('psn-group-modal-header').innerHTML = `
    <div class="psn-group-modal-cover">${g.icon ? `<img src="${esc(g.icon)}" alt="">` : '🏆'}</div>
    <div>
      <div class="psn-group-modal-title">${esc(_psnGroupsData.kind === 'steam' ? steamSetTitle(g) : g.name)}</div>
      <div class="psn-group-modal-sub">${_psnGroupsData.kind === 'steam' ? steamSetModalSub(g, earnedCount, groupTrophies.length) : `${earnedCount}/${groupTrophies.length} trophées obtenus`}</div>
    </div>`;
  document.getElementById('psn-group-modal-body').innerHTML = achievementGridHtml(groupTrophies, _psnGroupsData.kind === 'steam' ? 'steam' : 'psn');
  document.getElementById('modal-psn-group').classList.add('open');
}
function closePsnGroupModal() { document.getElementById('modal-psn-group').classList.remove('open'); }

// ── Ensembles de succès Steam (bêta du client Steam) : le jeu de base et chaque DLC ont leur propre carte et leur progression,
// comme les extensions des trophées PlayStation. Les DLC non possédés restent consultables mais ne comptent pas dans la
// progression (comme sur la page des succès de Steam) — le serveur envoie déjà les chiffres : groups = [{ id, name, kind
// 'base' | 'dlc' | 'set', owned, total, earned, dlcName, icon }] et chaque succès porte son groupId.
// Titre d'une carte d'ensemble : « Jeu de base », « DLC : <nom du DLC> » (le type n'est plus répété en pastille en haut de la carte), ou le nom de l'ensemble.
function steamSetTitle(g) {
  const name = g.name || '';
  if (g.kind === 'dlc') return /^dlc\b/i.test(name) ? name : 'DLC : ' + name;
  return name;
}
function steamSetModalSub(g, earned, total) {
  if (g.owned === false) return `${total} succès · DLC non possédé — non compté dans ta progression`;
  return `${earned}/${total} succès obtenus`;
}
function steamSetsHtml(achievements, groups) {
  const list = (groups || []).filter(g => g.total > 0).sort((a, b) => (a.owned === false ? 1 : 0) - (b.owned === false ? 1 : 0));
  _psnGroupsData = { trophies: achievements || [], groups: list, kind: 'steam' };
  const counted = list.filter(g => g.owned !== false);
  const earned = counted.reduce((n, g) => n + (g.earned || 0), 0);
  const total = counted.reduce((n, g) => n + (g.total || 0), 0);
  const pct = total ? Math.round(earned / total * 100) : 0;
  const locked = list.length - counted.length;
  const kinds = new Set(counted.map(g => g.kind));
  const legend = `<span class="steam-sets-legend"><i class="k-base"></i>Jeu de base${kinds.has('dlc') ? '<i class="k-dlc"></i>DLC' : ''}${kinds.has('set') ? '<i class="k-set"></i>Ensemble' : ''}${locked ? `<i class="k-locked"></i>${locked} non possédé${locked > 1 ? 's' : ''} (hors progression)` : ''}</span>`;
  const cards = list.map(g => {
    const isLocked = g.owned === false;
    const done = !isLocked && g.total > 0 && g.earned === g.total;
    const p = g.total ? Math.round(g.earned / g.total * 100) : 0;
    return `<div class="psn-group-card steam-set kind-${esc(g.kind)}${isLocked ? ' locked' : ''}${done ? ' done' : ''}" onclick="openPsnGroupModal('${esc(g.id)}')" title="${esc(g.dlcName || g.name)}">
      <div class="psn-group-card-cover">${g.icon ? `<img src="${esc(g.icon)}" alt="" onerror="this.style.visibility='hidden'">` : ''}</div>
      ${g.owned === false ? '' : `<span class="steam-set-badge" title="${done ? (g.kind === 'dlc' ? 'DLC à 100 %' : g.kind === 'set' ? 'Ensemble à 100 %' : 'Jeu de base à 100 %') : 'Pas encore à 100 %'}">${steamSetBadgeSvg(g.kind, done)}</span>`}
      <div class="psn-group-card-overlay">
        <div class="psn-group-card-name">${esc(steamSetTitle(g))}</div>
        ${isLocked
          ? `<div class="steam-set-locked">🔒 DLC non possédé · ${g.total} succès</div>`
          : `<div class="psn-group-card-progress">${g.earned}/${g.total} · ${p}%${done ? ' ✓' : ''}</div><div class="psn-group-card-bar"><div class="psn-group-card-bar-fill" style="width:${p}%"></div></div>`}
      </div>
    </div>`;
  }).join('');
  return `<div class="steam-sets-summary"><span><strong>${earned}/${total}</strong> succès · ${pct}%</span>${legend}</div><div class="psn-group-grid steam-sets">${cards}</div>`;
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const psnOpen = document.getElementById('modal-psn-group').classList.contains('open');
  document.querySelectorAll('.s-modal.open').forEach(m => m.classList.remove('open'));
  if (!psnOpen && document.documentElement.classList.contains('embed')) parent.postMessage({ type: 'fermer-jeu' }, '*');
});
// Clic sur le fond assombri : ferme la fiche (comme la croix).
document.getElementById('modal-jeu-detail').addEventListener('click', e => { if (e.target.id === 'modal-jeu-detail') closeJeuDetailModal(); });
document.getElementById('modal-psn-group').addEventListener('click', e => { if (e.target.id === 'modal-psn-group') closePsnGroupModal(); });

loadJeux();
</script>
</body>
</html>

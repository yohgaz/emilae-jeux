<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux — emilae_tv</title>
<script>
// ?jeu=<id> ouvre directement la fiche d'un jeu ; &embed=1 n'affiche QUE la
// fiche (fond transparent) — utilisé par le hub « nouvel onglet » du
// serveur stream, qui l'ouvre par-dessus sa page.
if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0D14;--c1:#14161F;--c2:#191C27;--c3:#1F2230;--cy:#F0653D;--mt:#6FDA9A;--go:#E8B84D;--tx:#F4F2ED;--mu:#A6A29B;--br:rgba(255,255,255,.16);
  --glass-fill:rgba(255,255,255,.06);
  --glass-fill-strong:rgba(255,255,255,.10);
  --glass-border:rgba(255,255,255,.14);
  --glass-highlight:rgba(255,255,255,.3);
  --blur:24px;
  --radius-lg:26px;--radius-md:16px;--radius-sm:10px}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:0;position:relative;overflow-x:hidden}

html.embed,html.embed body{background:transparent!important}
html.embed body>*:not(.s-modal):not(script){display:none!important}
/* Intégré au hub : pas de voile (le hub floute lui-même sa page), boîte
   au même fond sombre que sur le site quelle que soit la page hôte */
html.embed .s-modal{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
html.embed .s-modal-box{box-shadow:inset 0 1px 0 var(--glass-highlight),0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
html.embed .s-modal-box{background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.07)),#0E1119}

/* ── Fond ambiant ── */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none}
body::before{width:520px;height:520px;background:rgba(240,101,61,.10);top:-200px;left:-160px;animation:glass-drift1 34s ease-in-out infinite}
body::after{width:460px;height:460px;background:rgba(91,75,138,.16);bottom:-220px;right:-180px;animation:glass-drift2 30s ease-in-out infinite}
@keyframes glass-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,50px)}}
@keyframes glass-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-40px)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}

.page{position:relative;z-index:1;width:90%;max-width:1900px;margin:0 auto;padding:32px 0 60px}

/* ── Navigation Jeux / Planning — commune aux deux pages publiques, même
   style de pastille segmentée que le panneau admin (.bib-segmented /
   .bib-seg-btn dans tasks-editor.html) plutôt que 2 pilules séparées. ── */
.site-nav{display:inline-flex;background:var(--glass-fill);border:1px solid var(--glass-border);border-radius:10px;padding:3px;gap:3px;margin-bottom:18px}
.site-tab{border:none;background:transparent;color:var(--mu);text-decoration:none;font-size:13px;font-weight:800;padding:8px 18px;border-radius:7px;transition:all .15s}
.site-tab:hover{color:var(--tx)}
.site-tab.on{background:var(--cy);color:#0B0D14}

.site-header{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:26px}
.site-title{font-size:19px;font-weight:900;display:flex;flex-direction:column;gap:6px;text-align:right;max-width:420px}
.site-title-row{display:flex;align-items:center;gap:10px;justify-content:flex-end;line-height:1.35}
.site-title span.chan{font-size:13.5px;font-weight:800;color:var(--mu);background:var(--glass-fill-strong);padding:5px 12px;border-radius:999px;border:1px solid var(--glass-border)}
.site-updated{font-size:11.5px;color:var(--mu)}

.social-card{display:flex;flex-direction:column;gap:12px;background:var(--glass-fill);border:1px solid var(--glass-border);border-radius:var(--radius-md);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);box-shadow:inset 0 1px 0 var(--glass-highlight),0 10px 30px rgba(0,0,0,.3);padding:14px 20px;width:fit-content;flex-shrink:0}
.social-card-top{display:flex;align-items:stretch;gap:18px}
.social-card-logo{display:flex;align-items:stretch;flex-shrink:0}
.social-card-logo img{height:100%;width:auto;max-width:90px;object-fit:contain;display:block}
.social-card-links{display:flex;flex-direction:column;justify-content:center;gap:9px}
.social-link{display:flex;align-items:center;gap:10px;color:var(--tx);text-decoration:none;font-size:13.5px;font-weight:700;transition:color .15s}
.social-progress{padding-top:12px;border-top:1px solid var(--glass-border)}
.social-progress-label{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;font-weight:800;color:var(--tx);margin-bottom:5px}
.social-progress-label span:last-child{color:var(--cy);font-family:monospace}
.social-progress-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;width:100%}
.social-progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cy),var(--go));transition:width .4s}
.social-link:hover{color:var(--cy)}
.social-icon{width:19px;height:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.social-icon svg{width:100%;height:100%;display:block}

.jeux-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}
#jeux-search{flex:0 1 280px;background:var(--c2);border:1px solid var(--glass-border);border-radius:10px;padding:11px 14px;color:var(--tx);font-family:inherit;font-size:13.5px;outline:none}
#jeux-search:focus{border-color:var(--cy)}
#jeux-search::placeholder{color:var(--mu)}

.jeux-section{margin-bottom:28px}
.jeux-section:last-child{margin-bottom:0}
.jeux-section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.jeux-section-title{font-weight:900;font-size:13.5px;color:var(--tx)}
.jeux-section-badge{font-family:monospace;font-size:11.5px;font-weight:900;color:var(--mu);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:20px}
.jeux-section-sub{font-size:11.5px;color:var(--mu);margin:-6px 0 12px;line-height:1.5}
.jeux-empty{color:var(--mu);font-size:12px;padding:22px 16px;text-align:center;border:1.5px dashed var(--glass-border);border-radius:var(--radius-md)}

.jeux-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.jeu-card{position:relative;cursor:pointer;border-radius:var(--radius-sm);overflow:hidden;background:var(--glass-fill);border:1px solid var(--glass-border);transition:transform .15s,border-color .15s;aspect-ratio:2/3}
.jeu-card:hover{transform:translateY(-3px);border-color:var(--cy)}
.jeu-card-cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;opacity:.85;overflow:hidden}
.jeu-card-cover img{width:100%;height:100%;object-fit:cover}
.jeu-card-overlay{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,9,14,0) 0%,rgba(8,9,14,.55) 40%,rgba(8,9,14,.88) 100%);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);padding:22px 13px 12px}
.jeu-card-label{font-size:13.5px;font-weight:800;line-height:1.35;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.jeu-card-ministars{display:flex;gap:2px;margin:3px 0 1px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.jeu-card-badge-row{display:flex;align-items:stretch;gap:8px}
.jeu-card-badges-col{display:flex;flex-direction:row;gap:4px;flex-shrink:0}
.jeu-card-badges-col svg,.jeu-card-badges-col img{height:100%;width:auto;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));object-fit:contain}
.jeu-card-text-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.jeu-card-note{font-size:11.5px;color:var(--mu);padding-top:2px;white-space:pre-line;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.plat-badges{position:absolute;top:9px;right:9px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.plat-chip{display:flex;align-items:center;justify-content:center;width:27px;height:27px;padding:0;border-radius:8px;background:rgba(6,7,12,.72)!important;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22)!important;box-shadow:0 3px 10px rgba(0,0,0,.55)}
.plat-chip svg{display:block;width:15px;height:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.plat-chip img{display:block;width:15px;height:15px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

.jeu-progress-wrap{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.jeu-progress-row{display:flex;align-items:center;gap:7px}
.jeu-progress-plat-icon{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.jeu-progress-plat-icon svg,.jeu-progress-plat-icon img{width:100%;height:100%;display:block;object-fit:contain}
.jeu-progress-bar{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.jeu-progress-fill{height:100%;border-radius:4px;transition:width .3s}
.jeu-progress-pct{font-family:monospace;font-size:11.5px;color:var(--mu);min-width:32px;text-align:right}

/* ── Popup détail ── */
.s-modal{position:fixed;inset:0;background:rgba(4,5,10,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.s-modal.open{display:flex}
.s-modal-box{background:var(--glass-fill-strong);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:inset 0 1px 0 var(--glass-highlight),0 24px 60px rgba(0,0,0,.55);max-height:88vh;overflow-y:auto;padding:22px}

.jeu-detail-box{width:84vw;max-width:1440px;min-width:320px;max-height:84vh;padding:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.jeu-detail-close{position:absolute;top:14px;right:14px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(4,6,15,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--glass-border);color:var(--tx);font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.jeu-detail-close:hover{background:rgba(4,6,15,.85)}
.jeu-detail-banner{position:relative;height:260px;flex-shrink:0;background-size:cover;background-position:center 30%;background-color:var(--c2);-webkit-mask-image:linear-gradient(180deg,black 55%,transparent 100%);mask-image:linear-gradient(180deg,black 55%,transparent 100%)}
.jeu-detail-cover-wrap{position:absolute;left:28px;bottom:-46px;z-index:2}
.jeu-detail-cover{width:128px;height:192px;border-radius:12px;overflow:hidden;border:3px solid var(--bg);box-shadow:0 16px 34px rgba(0,0,0,.55);background:var(--glass-fill-strong);display:flex;align-items:center;justify-content:center;font-size:46px}
.jeu-detail-cover img{width:100%;height:100%;object-fit:cover;display:block}
.jeu-detail-logo-wrap{position:absolute;left:174px;right:60px;bottom:16px;z-index:2;display:flex;align-items:flex-end}
.jeu-detail-logo-wrap img{max-height:76px;max-width:100%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 16px rgba(0,0,0,.65))}
.jeu-detail-title-fallback{font-family:'Nunito',sans-serif;font-weight:900;font-size:26px;color:var(--tx);text-shadow:0 3px 14px rgba(0,0,0,.75);line-height:1.15}
.jeu-detail-info{padding:58px 28px 18px;flex-shrink:0}
.jeu-detail-info-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jeu-detail-status-badge{font-family:'Nunito',sans-serif;font-size:11.5px;font-weight:900;padding:5px 13px;border-radius:999px;background:var(--glass-fill-strong);border:1px solid var(--glass-border);color:var(--tx)}
.jeu-detail-stats-row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-top:12px;margin-top:14px;border-top:1px solid var(--glass-border)}
.jeu-detail-stats{display:flex;gap:26px}
.jeu-detail-stat{display:flex;flex-direction:column;position:relative;padding-right:24px}
.jeu-detail-stat strong{font-family:'Nunito',sans-serif;font-size:19px;font-weight:900}
.jeu-detail-stat span{font-size:11.5px;color:var(--mu);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.jeu-detail-stat-badge{position:absolute;top:-3px;right:0}
.jeu-detail-stat-badge img,.jeu-detail-stat-badge svg{width:22px;height:22px;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.jeu-detail-stat-badge svg.steam-badge{width:20px;height:30px;top:-6px}
.jeu-detail-pitch{font-size:12px;color:var(--tx);line-height:1.6;opacity:.85;margin-top:14px}
.gfr-resume{font-size:15px;line-height:1.65;color:var(--tx);margin-top:14px}
.gfr-faits{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.gfr-fait{display:flex;flex-direction:column;gap:2px;min-width:0}
.gfr-fait-l{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.gfr-fait-v{font-size:14.5px;color:var(--tx);font-weight:600;max-width:460px}
.gfr-pied{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.gfr-lien{font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);text-decoration:none;color:inherit}
.jeu-detail-studios{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.jeu-detail-studio-chip{background:rgba(255,255,255,.94);border-radius:8px;padding:6px 12px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.jeu-detail-studio-chip img{height:30px;max-width:130px;object-fit:contain;display:block}
.jeu-detail-studio-name{font-size:12px;font-weight:700;color:var(--tx);background:var(--glass-fill-strong);padding:6px 12px;border-radius:8px}
.jeu-detail-feed{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--glass-border);padding:18px 28px 26px}

.jeu-card-arrete-ribbon{position:absolute;top:21px;left:-23px;z-index:4;width:106px;transform:rotate(-45deg);text-align:center;background:linear-gradient(135deg,#8a1f1f,#5c1414);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:1px;padding:3px 0;box-shadow:0 3px 8px rgba(0,0,0,.5);text-transform:uppercase}
.jeu-card-occasion-ribbon{position:absolute;top:33px;left:-29px;z-index:4;width:143px;transform:rotate(-45deg);text-align:center;white-space:nowrap;background:linear-gradient(135deg,#6d5be0,#43349e);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:.5px;padding:3px 0;box-shadow:0 3px 8px rgba(0,0,0,.5);text-transform:uppercase}
.jeu-card-jeudumoment-ribbon{position:absolute;top:37px;left:-30px;z-index:4;width:153px;transform:rotate(-45deg);text-align:center;white-space:nowrap;background:linear-gradient(135deg,#0d9488,#0f5952);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:.2px;padding:3px 0;box-shadow:0 3px 8px rgba(0,0,0,.5);text-transform:uppercase}
.jeu-card-fridayfantasy-ribbon{position:absolute;top:37px;left:-30px;z-index:4;width:154px;transform:rotate(-45deg);text-align:center;white-space:nowrap;background:linear-gradient(135deg,#db2777,#831843);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:.2px;padding:3px 0;box-shadow:0 3px 8px rgba(0,0,0,.5);text-transform:uppercase}
.jeu-card-arrete{border:1px solid rgba(140,40,40,.5)!important}
.jeu-card-exclu-youtube-ribbon{position:absolute;top:38px;left:-30px;z-index:4;width:156px;transform:rotate(-45deg);text-align:center;white-space:nowrap;background:linear-gradient(135deg,#ff0000,#a30000);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:.3px;padding:3px 0;box-shadow:0 3px 8px rgba(0,0,0,.5);text-transform:uppercase}
.jeu-card-enpause-ribbon{position:absolute;top:33px;left:-29px;z-index:4;width:143px;transform:rotate(-45deg);text-align:center;white-space:nowrap;background:linear-gradient(135deg,#d97706,#92400e);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:.5px;padding:3px 0;box-shadow:0 3px 8px rgba(0,0,0,.5);text-transform:uppercase}
.jeu-card-twitchvod-ribbon{position:absolute;top:34px;left:-29px;z-index:4;width:145px;transform:rotate(-45deg);text-align:center;white-space:nowrap;background:linear-gradient(to top right,#9146FF,#ff0000);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:.3px;padding:3px 0;box-shadow:0 3px 8px rgba(0,0,0,.5);text-transform:uppercase}

/* ── Note (étoiles + points +/-) — affichage seul ici (site statique, sans
   backend pour enregistrer une modification) ; le clic déplie/replie
   uniquement, avec la même transition douce que le panneau local. */
.game-rating-widget{margin:0 28px 18px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--glass-fill-strong),var(--glass-fill));border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);box-shadow:inset 0 1px 0 var(--glass-highlight),0 8px 24px rgba(0,0,0,.25);overflow:hidden}
.game-rating-header{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none}
.game-rating-stars{display:flex;gap:5px}
.game-rating-star{display:inline-flex;filter:drop-shadow(0 0 6px rgba(240,101,61,.35))}
.game-rating-chevron{font-size:12px;color:var(--mu);transition:transform .3s ease;margin-left:2px}
.game-rating-widget.expanded .game-rating-chevron{transform:rotate(180deg)}
.game-rating-body{max-height:0;opacity:0;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1),opacity .28s ease}
.game-rating-widget.expanded .game-rating-body{max-height:640px;opacity:1}
.game-rating-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.game-rating-col{border-radius:var(--radius-sm);padding:12px}
.game-rating-col-pros{background:rgba(111,218,154,.09);border:1px solid rgba(111,218,154,.32)}
.game-rating-col-cons{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.32)}
.game-rating-col-title{font-size:11.5px;font-weight:900;letter-spacing:1.2px;margin-bottom:9px;text-transform:uppercase}
.game-rating-col-pros .game-rating-col-title{color:var(--mt)}
.game-rating-col-cons .game-rating-col-title{color:#FF6B6B}
.game-rating-item{font-size:12px;color:var(--tx);margin-bottom:7px;line-height:1.4}
.game-rating-empty-hint{font-size:11.5px;color:var(--mu);font-style:italic}
.game-rating-comment-wrap{padding:0 16px 16px}
.game-rating-comment-title{font-size:11.5px;font-weight:900;letter-spacing:1.2px;margin-bottom:8px;text-transform:uppercase;color:var(--mu)}
.game-rating-comment-text{font-size:12px;color:var(--tx);line-height:1.5;white-space:pre-wrap;background:rgba(0,0,0,.22);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:10px 12px}
.jeu-detail-empty{color:var(--mu);font-size:13.5px;padding:30px;text-align:center}
.jeu-detail-section{margin-bottom:18px}
.jeu-detail-section:last-child{margin-bottom:0}
.jeu-detail-section-head{font-weight:900;font-size:13.5px;color:var(--cy);margin-bottom:10px}
.jeu-detail-ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-items:start}

/* ── Explorateur de succès par catégorie/liste (FFXIV) ── */
.ach-explorer{display:flex;flex-direction:column;gap:16px}
.ach-explorer-recent-title{font-size:13.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.ach-explorer-recent-row{display:flex;gap:12px;overflow:hidden;justify-content:center}
.ach-explorer-recent-item{flex:0 0 auto;width:260px;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.ach-explorer-recent-item:hover{background:rgba(255,255,255,.06);border-color:var(--go)}
.ach-explorer-recent-icon{font-size:38px;flex-shrink:0}
.ach-explorer-recent-icon-img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;border:1px solid var(--glass-border);background:rgba(255,255,255,.04)}

.psn-group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.psn-group-card{position:relative;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;border:1px solid var(--glass-border);aspect-ratio:1/1;background:var(--c2);transition:transform .15s,border-color .15s}

.psn-group-card-cover{position:absolute;inset:0}

.psn-group-modal-header{display:flex;align-items:center;gap:20px;padding:26px 28px;background:rgba(255,255,255,.03)}

/* ── Ensembles de succès Steam : une carte par ensemble (jeu de base bleu, DLC violet), les DLC non possédés restent consultables ── */
.psn-group-grid.steam-sets { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.steam-sets .psn-group-card { aspect-ratio: 460 / 215; }
.steam-set-badge { position: absolute; top: 6px; right: 8px; z-index: 1; width: 24px; height: 36px; filter: drop-shadow(0 1px 4px rgba(0,0,0,.7)); }
.steam-set-badge svg { width: 100%; height: 100%; display: block; }
.steam-set.kind-base .psn-group-card-progress { color: #6CB4FF; }
.steam-set.kind-dlc .psn-group-card-progress { color: #C4A8FF; }
.steam-set.kind-set .psn-group-card-progress { color: #5EEAD4; }

.steam-set.kind-dlc .psn-group-card-bar-fill { background: linear-gradient(90deg, #8B5CF6, #C4A8FF); }
.steam-set.kind-set .psn-group-card-bar-fill { background: linear-gradient(90deg, #14B8A6, #5EEAD4); }
.steam-set.done { border-color: rgba(111,218,154,.75); }
.steam-set.locked { border-style: dashed; }
.steam-set.locked .psn-group-card-cover { filter: grayscale(1) brightness(.5); }
.steam-set-locked { margin-top: 4px; font-size: 12px; font-weight: 800; color: var(--mu); }
.steam-sets-summary { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin: 2px 0 12px; font-size: 14px; color: var(--tx); }

.steam-sets-legend { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 4px; color: var(--mu); font-size: 12.5px; }
.steam-sets-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 12px; }
.steam-sets-legend .k-base { background: #3B82F6; } .steam-sets-legend .k-dlc { background: #8B5CF6; } .steam-sets-legend .k-set { background: #14B8A6; } .steam-sets-legend .k-locked { background: transparent; border: 1.5px dashed var(--mu); }

@media (max-width:900px){
  .jeu-detail-box{width:94vw;min-width:0}
  .jeu-detail-logo-wrap{left:150px;right:20px}
  /* Le header (carte réseaux + titre) est en flex-wrap — en dessous d'une
     certaine largeur (~780px, la somme des deux blocs) il passe déjà à la
     ligne tout seul, mais restait aligné à gauche/droite comme s'il avait
     encore son voisin à côté (justify-content:space-between sur un item
     seul par ligne ≈ flex-start) : look bancal en tablette portrait, gros
     vide à droite du titre pourtant aligné à droite. Centré une fois replié
     plutôt que d'ajouter un nouveau palier — cette régle ne s'applique de
     toute façon qu'une fois le wrap déjà déclenché. */
  .site-header{justify-content:center}
  .site-title{text-align:center}
  .site-title-row{justify-content:center}
  /* Cible tactile de fermeture de la fiche détail — sous 900px c'est du
     tactile (tablette ou téléphone) la quasi totalité du temps ; 44px est
     la taille mini recommandée (WCAG/Apple/Google) pour un bouton à toucher
     au doigt, très en dessous des 34px de la version souris. */
  .jeu-detail-close{width:44px;height:44px;font-size:15px}
}

/* ── MODERNE ÉPURÉ — même habillage que le panneau local et l'overlay de stream : surfaces plates, filets fins,
   plus de halos de couleur derrière la page, la couleur gardée pour ce qui est actif ou important. Même palette
   (#0B0D14 / #14161F / #191C27 / #1F2230, orange #F0653D, menthe #6FDA9A, or #E8B84D, texte #F4F2ED, gris #A6A29B).
   Supprimer ce bloc = ancien design. ── */
:root{--glass-fill:rgba(255,255,255,.035);--glass-fill-strong:rgba(255,255,255,.065);--glass-border:rgba(255,255,255,.08);--glass-highlight:rgba(255,255,255,0);--br:rgba(255,255,255,.09);--blur:0px;--radius-lg:20px;--radius-md:14px;--radius-sm:10px}
body::before,body::after{display:none}
.social-card{box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.social-progress-fill{background:var(--cy)}
.social-progress-label span:last-child{font-family:'Nunito',sans-serif;font-variant-numeric:tabular-nums}
.week-title{color:var(--tx)}
.event-card{box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-left-width:3px}
.event-card-clickable:hover,.grid-event-clickable:hover,.jeu-card:hover{transform:none}
.event-time,.grid-event-time{font-family:'Nunito',sans-serif;font-variant-numeric:tabular-nums}
.grid-event{box-shadow:none;border-top-width:2px}
.grid-day.is-today .grid-day-head{border-bottom-width:2px}
.s-modal-box{box-shadow:0 24px 60px rgba(0,0,0,.55)}
.game-rating-widget{background:var(--glass-fill)}
.ffxiv-banner{background:linear-gradient(160deg,#1B1D28,#12141C)}
.ffxiv-banner-name{text-shadow:none}

/* ── MODERNE — même langage que l'overlay de stream (scène « talking ») et le panneau local (css/modern-site.css) :
   cartes plates #14161F à filet fin, étiquettes en petites capitales grises précédées d'un point orange, rubans en
   diagonale remplacés par des pastilles d'étiquette (« Jeu du moment », « Friday Fantasy »…, mêmes couleurs que sur
   l'overlay), barres fines, fenêtres plates. Supprimer ce bloc = design précédent. ── */

<script>
let _jeuxData = { termines: [], enCours: [], prochainement: [] };

function esc(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Note (étoiles + points +/-) — affichage seul, rien à enregistrer ici
// (site statique, sans backend) : tout vient déjà du JSON publié.
// Icône étoile en SVG (même forme exacte pour pleine/vide, seule la couleur
// change) — garantit un alignement pixel près, contrairement à un caractère
// de police dont le rendu peut varier légèrement.
const STAR_SVG_PATH = 'M12 2.5l2.97 6.02 6.65.97-4.81 4.69 1.14 6.62L12 17.77l-5.95 3.03 1.14-6.62-4.81-4.69 6.65-.97L12 2.5z';
function starIconHtml(filled, sizePx){
  const color = filled ? 'var(--cy)' : 'var(--mu)';
  const opacity = filled ? '1' : '.5';
  return `<svg viewBox="0 0 24 24" width="${sizePx}" height="${sizePx}" style="flex-shrink:0;display:block"><path d="${STAR_SVG_PATH}" fill="${color}" opacity="${opacity}"/></svg>`;
}
function renderPublicGameRating(jeu){
  const box = document.getElementById('game-rating-widget');
  if (!box) return;
  const rating = jeu.rating || 0;
  const pros = jeu.pros || [];
  const cons = jeu.cons || [];
  const comment = jeu.comment || '';
  // Pas de widget vide pour un jeu jamais noté — juste du bruit visuel
  // pour les viewers qui parcourent le site.
  if (!rating && !pros.length && !cons.length && !comment) { box.innerHTML = ''; return; }
  const starsHtml = [1,2,3,4,5].map(i => `<span class="game-rating-star">${starIconHtml(i <= rating, 26)}</span>`).join('');
  const itemsHtml = (list) => list.length ? list.map(item => `<div class="game-rating-item">${esc(item)}</div>`).join('') : `<div class="game-rating-empty-hint">Aucun point</div>`;
  const commentHtml = comment
    ? `<div class="game-rating-comment-wrap"><div class="game-rating-comment-title">📝 Remarques</div><div class="game-rating-comment-text">${esc(comment)}</div></div>`
    : '';
  box.innerHTML = `
    <div class="game-rating-widget" id="game-rating-widget-inner">
      <div class="game-rating-header" onclick="togglePublicGameRating()">
        <span class="game-rating-stars">${starsHtml}</span>
        <span class="game-rating-chevron">▾</span>
      </div>
      <div class="game-rating-body">
        <div class="game-rating-columns">
          <div class="game-rating-col game-rating-col-pros">
            <div class="game-rating-col-title">✅ Points positifs</div>
            ${itemsHtml(pros)}
          </div>
          <div class="game-rating-col game-rating-col-cons">
            <div class="game-rating-col-title">❌ Points négatifs</div>
            ${itemsHtml(cons)}
          </div>
        </div>
        ${commentHtml}
      </div>
    </div>`;
}
function togglePublicGameRating(){
  const el = document.getElementById('game-rating-widget-inner');
  if (el) el.classList.toggle('expanded');
}

// ── Plateformes : icônes réelles Steam/PlayStation, pictogramme maison Nintendo ──
const PLAT_COLOR = { 'playstation': '#0070D1', 'pc': '#66C0F4', 'xbox': '#107C10', 'nintendo': '#E4000F', 'switch': '#E4000F' };
function platColor(p) {
  const k = (p || '').toLowerCase();
  for (const key in PLAT_COLOR) if (k.includes(key)) return PLAT_COLOR[key];
  return '#8892a6';
}
const PLAT_ICON_SVG = {
  steam: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/></svg>',
  playstation: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.984 2.596v17.547l3.915 1.261V6.688c0-.69.304-1.151.794-.991.636.18.76.814.76 1.505v5.875c2.441 1.193 4.362-.002 4.362-3.152 0-3.237-1.126-4.675-4.438-5.827-1.307-.448-3.728-1.186-5.39-1.502zm4.656 16.241l6.296-2.275c.715-.258.826-.625.246-.818-.586-.192-1.637-.139-2.357.123l-4.205 1.5V14.98l.24-.085s1.201-.42 2.913-.615c1.696-.18 3.785.03 5.437.661 1.848.601 2.04 1.472 1.576 2.072-.465.6-1.622 1.036-1.622 1.036l-8.544 3.107V18.86zM1.807 18.6c-1.9-.545-2.214-1.668-1.352-2.32.801-.586 2.16-1.052 2.16-1.052l5.615-2.013v2.313L4.205 17c-.705.271-.825.632-.239.826.586.195 1.637.15 2.343-.12L8.247 17v2.074c-.12.03-.256.044-.39.073-1.939.331-3.996.196-6.038-.479z"/></svg>',
  nintendo: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="8" height="20" rx="4" fill="#E6002A"/><circle cx="6" cy="7" r="1.3" fill="#fff" opacity=".9"/><rect x="14" y="2" width="8" height="20" rx="4" fill="#2E9CE0"/><circle cx="18" cy="17" r="1.6" fill="#fff" opacity=".9"/></svg>',
  eso: '<svg viewBox="0 0 24 24"><path d="M12 1.4l7.5 2.8v5.9c0 5.4-3.2 9.5-7.5 11.3-4.3-1.8-7.5-5.9-7.5-11.3V4.2L12 1.4z" fill="#8A2432"/><path d="M12 4l5.2 1.95v4.3c0 3.9-2.2 6.95-5.2 8.35-3-1.4-5.2-4.45-5.2-8.35V5.95L12 4z" fill="none" stroke="#D9B45C" stroke-width="1.1"/><circle cx="12" cy="10.6" r="1.9" fill="#D9B45C"/></svg>'
};
const FFXIV_LOGO_IMG = '<img src="./ffxiv-logo.png" alt="FFXIV" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML=\'<span style=&quot;font-size:11.5px;font-weight:900&quot;>XIV</span>\'">';
function platIconSvg(p, ffxiv) {
  const k = (p || '').toLowerCase();
  if (k.includes('playstation')) return PLAT_ICON_SVG.playstation;
  if (k === 'pc') return ffxiv ? FFXIV_LOGO_IMG : PLAT_ICON_SVG.steam;
  if (k === 'xbox') return XBOX_ICON_SVG;
  if (k.includes('nintendo') || k.includes('switch')) return PLAT_ICON_SVG.nintendo;
  return '';
}
function platChipsRaw(plateformes, nom) {
  const ffxiv = isFfxivGame(nom);
  return (plateformes || []).map(p => {
    const c = platColor(p);
    const label = (ffxiv && p.toLowerCase() === 'pc') ? 'FFXIV (launcher officiel)' : p;
    return `<span class="plat-chip" style="background:${c}22;border-color:${c}66;color:${c}" title="${esc(label)}">${platIconSvg(p, ffxiv)}</span>`;
  }).join('');
}
function platBadgesHtml(plateformes, nom) { return `<div class="plat-badges">${platChipsRaw(plateformes, nom)}</div>`; }
function platBadgesInlineHtml(plateformes, nom) { return `<div style="display:flex;gap:5px;flex-shrink:0">${platChipsRaw(plateformes, nom)}</div>`; }

function jeuHue(nom) {
  let h = 0;
  for (let i = 0; i < nom.length; i++) h = (h * 31 + nom.charCodeAt(i)) % 360;
  return h;
}
function isFfxivGame(nom) {
  return (nom || '').toLowerCase().includes('final fantasy xiv');
}

// Beaucoup de jeux AAA listent une dizaine de studios régionaux d'une même
// maison mère (ex: "Ubisoft Kyiv", "Ubisoft Montpellier"...). On ne garde
// que le nom le plus court d'un groupe quand l'un est le préfixe des autres
// (ex: "Ubisoft" avale "Ubisoft Kyiv") — un seul logo au lieu d'une dizaine.
function collapseStudios(companies) {
  const swallowed = new Set();
  companies.forEach((c, i) => {
    const isSub = companies.some((other, j) => i !== j && other.name.length < c.name.length && c.name.toLowerCase().startsWith(other.name.toLowerCase() + ' '));
    if (isSub) swallowed.add(c.name);
  });
  const kept = companies.filter(c => !swallowed.has(c.name));
  const byName = {};
  kept.forEach(c => { byName[c.name.toLowerCase()] = { ...c }; });
  companies.forEach(c => {
    if (!swallowed.has(c.name)) return;
    const parentKey = Object.keys(byName).find(k => c.name.toLowerCase().startsWith(k + ' '));
    if (!parentKey) return;
    byName[parentKey].developer = byName[parentKey].developer || c.developer;
    byName[parentKey].publisher = byName[parentKey].publisher || c.publisher;
    if (!byName[parentKey].logo && c.logo) byName[parentKey].logo = c.logo;
  });
  return Object.values(byName);
}

// Jaquette : Steam si liée, sinon IGDB, sinon icône PSN, sinon emoji. Les
// candidats sont enchaînés (pas figés sur le premier) : pour un jeu tout
// juste sorti, la jaquette Steam library_600x900.jpg peut ne pas encore
// exister alors qu'une jaquette IGDB est bien liée — sans ce correctif,
// l'échec silencieux de l'image Steam masquait complètement ce choix
// (retombait direct sur l'emoji). Même correctif que côté panneau
// (tasks-editor.html), qui a le même bug d'origine.
function coverCandidatesFor(j) {
  return [
    j.steamAppId ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${j.steamAppId}/library_600x900.jpg` : null,
    j.igdbCover || null,
    (j.progression && j.progression.PlayStation && j.progression.PlayStation.icon) || null
  ].filter(Boolean);
}
function coverImgFallback(img) {
  let remaining = [];
  try { remaining = JSON.parse(img.dataset.coverCandidates || '[]'); } catch (e) {}
  if (remaining.length) {
    img.src = remaining.shift();
    img.dataset.coverCandidates = JSON.stringify(remaining);
  } else {
    // parentElement lu AVANT remove() : une fois détaché, l'élément n'a
    // plus de parent (l'ancien onerror inline faisait remove() puis lisait
    // parentElement — déjà null à ce moment, l'emoji ne s'affichait jamais).
    const parent = img.parentElement;
    img.remove();
    if (parent) parent.textContent = '🎮';
  }
}
function coverInnerHtml(j) {
  const candidates = coverCandidatesFor(j);
  if (!candidates.length) return '🎮';
  return `<img src="${esc(candidates[0])}" data-cover-candidates='${esc(JSON.stringify(candidates.slice(1)))}' alt="" onerror="coverImgFallback(this)">`;
}

// ── Pourcentages : formule officielle PlayStation (bronze 15, argent 30, or 90 ;
// le platine ne compte pas), Steam en simple ratio. ──
const TROPHY_POINTS = { bronze: 15, argent: 30, or: 90 };
function calcPercentPS(t) {
  if (!t) return null;
  let earned = 0, total = 0;
  Object.keys(TROPHY_POINTS).forEach(k => {
    const d = t[k] || {};
    earned += (parseInt(d.earned) || 0) * TROPHY_POINTS[k];
    total += (parseInt(d.total) || 0) * TROPHY_POINTS[k];
  });
  return total > 0 ? Math.round(earned / total * 100) : null;
}
function calcPercentSteam(s) {
  if (!s || !(parseInt(s.total) > 0)) return null;
  return Math.round((parseInt(s.earned) || 0) / parseInt(s.total) * 100);
}
function calcPercentXbox(x) {
  if (!x || !(parseInt(x.total) > 0)) return null;
  return Math.round((parseInt(x.earned) || 0) / parseInt(x.total) * 100);
}

const STEAM_100_BADGE_SVG = '<svg viewBox="0 0 24 24"><path d="M12.0,0.5 L14.07,2.93 L16.99,1.64 L17.8,4.73 L20.99,4.83 L20.38,7.96 L23.21,9.44 L21.3,12.0 L23.21,14.56 L20.38,16.04 L20.99,19.17 L17.8,19.27 L16.99,22.36 L14.07,21.07 L12.0,23.5 L9.93,21.07 L7.01,22.36 L6.2,19.27 L3.01,19.17 L3.62,16.04 L0.79,14.56 L2.7,12.0 L0.79,9.44 L3.62,7.96 L3.01,4.83 L6.2,4.73 L7.01,1.64 L9.93,2.93 Z" fill="#3B82F6"/><circle cx="12" cy="12" r="7" fill="#FFC93D"/><path d="M8.5 12.2l2.3 2.3 4.7-4.9" stroke="#7A5300" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLATINUM_TROPHY_SVG = '<svg viewBox="0 0 24 24"><path d="M6 5C3 5 2 6.8 2 9c0 2.5 2 3.8 4 4" fill="none" stroke="#D7DEE6" stroke-width="1.5" stroke-linecap="round"/><path d="M18 5c3 0 4 1.8 4 4 0 2.5-2 3.8-4 4" fill="none" stroke="#D7DEE6" stroke-width="1.5" stroke-linecap="round"/><path d="M6 3h12v5.2c0 3.4-2.7 6.1-6 6.1S6 11.6 6 8.2V3z" fill="#E8EDF2"/><rect x="10.6" y="14" width="2.8" height="4" fill="#D7DEE6"/><rect x="7.3" y="18" width="9.4" height="1.8" rx="0.5" fill="#E8EDF2"/><rect x="5.8" y="19.9" width="12.4" height="1.7" rx="0.5" fill="#C4CDD6"/></svg>';

function progressRowHtml(iconHtml, pct, color) {
  return `<div class="jeu-progress-row">
    <span class="jeu-progress-plat-icon" style="color:${color}">${iconHtml}</span>
    <div class="jeu-progress-bar"><div class="jeu-progress-fill" style="width:${pct}%;background:${color}"></div></div>

  </div>`;
}
// ── Progression affichée sur une CARTE : UNE seule barre ──
//  • MMO (FFXIV, Elder Scrolls Online) : la progression INTERNE au jeu — hauts faits (Lodestone) / succès ESO (addon en jeu) — jamais les succès Steam ni les trophées PlayStation,
//    peu représentatifs pour un MMO. Sans donnée interne publiée : pas de barre plutôt qu'un chiffre de plateforme trompeur.
//  • Les autres jeux, sur plusieurs plateformes (PlayStation + Steam…) : seule la plus avancée est affichée (en cas d'égalité : celle qui a le plus de succès obtenus, puis l'ordre
//    PlayStation, Steam, Xbox, Nintendo). Le badge « 100 % » de la carte suit la même plateforme. La fiche détaillée, elle, montre toutes les plateformes.
const isEsoGame = (nom) => /elder scrolls online/i.test(nom || '');
const estMmo = (j) => isFfxivGame(j.nom) || isEsoGame(j.nom);
const ESO_COLOR = '#B63A4C';
function progressionInterneMmo(j) {
  const ffxiv = isFfxivGame(j.nom);
  const src = ffxiv ? (j.ffxiv && j.ffxiv.achievements) : (isEsoGame(j.nom) ? (j.eso && j.eso.achievements) : null);
  if (!src || src.earned === null || src.earned === undefined || !src.total) return null;
  return { cle: ffxiv ? 'ffxiv' : 'eso', pct: Math.round(src.earned / src.total * 100), earned: src.earned, total: src.total };
}
function candidatesProgression(j) {
  const prog = j.progression || {}, switchAch = j.achievements && j.achievements.switch;
  const c = [];
  if (prog.PlayStation) {
    const pct = calcPercentPS(prog.PlayStation);
    if (pct !== null) {
      const platine = !!prog.PlayStation.platine;
      const earned = ['bronze', 'argent', 'or'].reduce((s, k) => s + (parseInt(prog.PlayStation[k] && prog.PlayStation[k].earned) || 0), 0) + (platine ? 1 : 0);
      c.push({ icone: PLAT_ICON_SVG.playstation, pct, couleur: platColor('PlayStation'), rang: platine ? 100 : pct, earned, badge: (pct === 100 || platine) ? PLATINUM_TROPHY_SVG : '' });
    }
  }
  if (prog.PC) {
    const pct = calcPercentSteam(prog.PC);
    if (pct !== null) c.push({ icone: PLAT_ICON_SVG.steam, pct, couleur: platColor('PC'), rang: pct, earned: parseInt(prog.PC.earned) || 0, badge: pct === 100 ? steamBadgeSvg(prog.PC.steamState === 'full' ? 'full' : 'base') : '' });
  }
  if (prog.Xbox) {
    const pct = calcPercentXbox(prog.Xbox);
    if (pct !== null) c.push({ icone: XBOX_ICON_SVG, pct, couleur: XBOX_COLOR, rang: pct, earned: parseInt(prog.Xbox.earned) || 0, badge: pct === 100 ? XBOX_ICON_SVG : '' });
  }
  // Nintendo (Switch/Switch 2) : succès via le système de tâches, déjà synchronisés dans jeu.achievements.switch — couleur rouge officielle.
  if (switchAch && switchAch.length) {
    const earned = switchAch.filter(a => a.earned).length;
    const pct = Math.round(earned / switchAch.length * 100);
    c.push({ icone: PLAT_ICON_SVG.nintendo, pct, couleur: platColor('nintendo'), rang: pct, earned, badge: earned === switchAch.length ? PLAT_ICON_SVG.nintendo : '' });
  }
  return c.map((x, i) => ({ ...x, ordre: i }));
}
function progressionCarte(j) {
  if (estMmo(j)) {
    const m = progressionInterneMmo(j);
    return m ? { icone: m.cle === 'ffxiv' ? '🏆' : PLAT_ICON_SVG.eso, pct: m.pct, couleur: m.cle === 'ffxiv' ? 'var(--go)' : ESO_COLOR, badge: '' } : null;
  }
  const c = candidatesProgression(j);
  if (!c.length) return null;
  return c.sort((a, b) => (b.rang - a.rang) || (b.earned - a.earned) || (a.ordre - b.ordre))[0];
}
function progressBarsHtml(choix) {
  return choix ? `<div class="jeu-progress-wrap">${progressRowHtml(choix.icone, choix.pct, choix.couleur)}</div>` : '';
}
// Badge « ensemble terminé » OFFICIEL de Steam (rosace à engrenage sur son socle) : tracé et couleurs extraits du client Steam

const STEAM_BADGE_COLORS = { none: '#48505E', base: '#1A9FFF', full: '#B658C4', set: '#1A9FFF' };
const STEAM_BADGE_TITLES = { none: 'Pas encore à 100 %', base: 'Jeu de base à 100 %', full: '100 % : jeu de base et DLC', set: 'Ensemble à 100 %' };
const STEAM_BADGE_TRACES = [

function steamBadgeSvg(state) {

function steamSetBadgeSvg(kind, done) {

// Résumé + faits de la fiche d'un jeu, EN FRANÇAIS UNIQUEMENT (fiche construite à la publication : Steam fr, Wikipédia FR, GOG/Xbox fr).
// Les anciennes publications contenaient le résumé IGDB en anglais : tout texte qui n'a pas l'air français est écarté ici aussi.
function textIsFrench(t) {
  const s = ' ' + String(t || '').toLowerCase().replace(/[^a-zàâäçéèêëîïôöùûüÿœæ' ]+/g, ' ') + ' ';
  const n = (ws) => ws.reduce((a, w) => a + (s.split(` ${w} `).length - 1), 0);
  return n(['le', 'la', 'les', 'des', 'du', 'de', 'une', 'un', 'est', 'et', 'dans', 'pour', 'qui', 'que', 'sur', 'au', 'aux', 'vous', 'votre', 'nous', 'ce', 'cette', 'sont', 'il', 'elle', 'en', 'plus', 'pas'])
       > n(['the', 'of', 'and', 'is', 'was', 'in', 'to', 'for', 'with', 'you', 'your', 'are', 'will', 'can', 'this', 'that', 'it', 'at', 'all', 'new', 'from', 'out', 'not', 'have', 'has', 'their', 'they', 'but', 'into', 'its']);
}
function gameFrPublicHtml(jeu) {
  const fiche = jeu.ficheFr || {};
  const resume = jeu.pitch && textIsFrench(jeu.pitch) ? `<div class="gfr-resume">${esc(jeu.pitch)}</div>` : '';
  const faits = (fiche.faits || []).map(x => `<div class="gfr-fait"><span class="gfr-fait-l">${esc(x.label)}</span><span class="gfr-fait-v">${esc(x.value)}</span></div>`).join('');
  const liens = (fiche.liens || []).filter(l => /^https?:\/\//.test(l.url || '')).map(l => `<a class="gfr-lien" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  return `${resume}${faits ? `<div class="gfr-faits">${faits}</div>` : ''}${liens ? `<div class="gfr-pied">${liens}</div>` : ''}`;
}
const steamBadgeSpan = (state) => `<span class="jeu-detail-stat-badge" title="${STEAM_BADGE_TITLES[state] || ''}">${steamBadgeSvg(state)}</span>`;

}

// ── Chargement des données ──
async function loadJeux() {
  try {
    const r = await fetch('./jeux-public.json?t=' + Date.now()).then(r => r.json());
    _jeuxData = { termines: r.termines || [], enCours: r.enCours || [], prochainement: r.prochainement || [] };
    if (r.updatedAt) {
      const d = new Date(r.updatedAt);
      document.getElementById('site-updated').textContent = 'Mis à jour le ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }
  } catch (e) {
    document.getElementById('jeux-content').innerHTML = `<div class="jeux-empty">Impossible de charger la liste des jeux pour l'instant. Réessaie un peu plus tard.</div>`;
    return;
  }
  renderJeux();
  renderGlobalProgress();
  const wanted = new URLSearchParams(location.search).get('jeu');
  if (wanted) {
    const statut = ['enCours', 'termines', 'prochainement'].find(k => (_jeuxData[k] || []).some(j => j.id === wanted));
    if (statut) openJeuDetailView(wanted, statut);
    else if (document.documentElement.classList.contains('embed')) parent.postMessage({ type: 'jeu-introuvable', id: wanted }, '*');
  }
}

// Moyenne d'avancée sur toute la bibliothèque. Un jeu multi-plateforme ne
// compte qu'une fois — on garde la source qui a le plus de succès/trophées
// obtenus (pas forcément le plus haut pourcentage), pour refléter la
// progression la plus "vécue" plutôt qu'un doublon qui gonflerait la moyenne.
function renderGlobalProgress() {
  const box = document.getElementById('social-progress');
  const all = [..._jeuxData.termines, ..._jeuxData.enCours];
  const percents = [];

  all.forEach(j => {
    const prog = j.progression || {};
    const candidates = [];
    if (prog.PlayStation) {
      const pct = calcPercentPS(prog.PlayStation);
      if (pct !== null) {
        const earned = ['bronze', 'argent', 'or'].reduce((sum, k) => sum + (parseInt(prog.PlayStation[k]?.earned) || 0), 0);
        candidates.push({ pct, earned });
      }
    }
    if (prog.PC) {
      const pct = calcPercentSteam(prog.PC);
      if (pct !== null) candidates.push({ pct, earned: parseInt(prog.PC.earned) || 0 });
    }
    if (prog.Xbox) {
      const pct = calcPercentXbox(prog.Xbox);
      if (pct !== null) candidates.push({ pct, earned: parseInt(prog.Xbox.earned) || 0 });
    }
    if (j.ffxiv && j.ffxiv.achievements) {
      const a = j.ffxiv.achievements;
      if (a.earned !== null && a.earned !== undefined && a.total) {
        candidates.push({ pct: Math.round(a.earned / a.total * 100), earned: a.earned });
      }
    }
    if (candidates.length) {
      candidates.sort((a, b) => b.earned - a.earned);
      percents.push(candidates[0].pct);
    }
  });

  if (!percents.length) { box.style.display = 'none'; return; }
  const avg = Math.round(percents.reduce((a, b) => a + b, 0) / percents.length);
  document.getElementById('social-progress-pct').textContent = avg + '%';
  document.getElementById('social-progress-fill').style.width = avg + '%';
  box.style.display = '';
}

// Étoiles miniatures sur une jaquette — seulement si le jeu a une note,
// toujours 5 étoiles au total (pleines dorées jusqu'à la note, noires avec
// contour visible ensuite). La note est déjà dans le JSON publié, pas
// besoin d'appel séparé (site statique).
function miniStarsHtml(rating){
  if (!rating) return '';
  const stars = [1,2,3,4,5].map(i => starIconHtml(i <= rating, 12)).join('');
  return `<div class="jeu-card-ministars">${stars}</div>`;
}
function jeuCardHtml(j, statut) {

  // Même ruban que "Prochainement" pour le même statut (voir

  const excluYoutubeRibbon = j.excluYoutube ? `<div class="jeu-card-exclu-youtube-ribbon">Exclu YouTube</div>` : '';

// Carte "Prochainement" — même habillage que jeuCardHtml (jaquette,
// plateformes, ruban de diffusion) mais sans étoiles/barre de progression
// (rien n'a encore été joué) ni clic (pas de fiche détail pour ces
// intentions, juste une jaquette et un nom).
function prochainementCardHtml(item) {
  const hue = jeuHue(item.nom);
  const ribbon = item.diffusion === 'exclu_youtube'
    ? `<div class="jeu-card-exclu-youtube-ribbon">Exclu YouTube</div>`
    : item.diffusion === 'twitch_vod'
    ? `<div class="jeu-card-twitchvod-ribbon">Twitch &amp; VOD</div>`
    : '';
  // Pas coverInnerHtml (elle ne connaît que igdbCover/steamAppId/l'icône PSN,
  // absents d'une entrée Prochainement) — celle-ci a son propre champ direct
  // "cover" (voir /prochainement côté serveur).
  const cover = item.cover
    ? `<img src="${esc(item.cover)}" alt="" onerror="coverImgFallback(this)">`
    : '🎮';
  return `<div class="jeu-card" style="cursor:default">
    ${ribbon}
    ${platBadgesHtml(item.plateformes, item.nom)}
    <div class="jeu-card-cover" style="background:linear-gradient(145deg, hsl(${hue} 45% 18%), hsl(${hue} 45% 10%))">${cover}</div>
    <div class="jeu-card-overlay">
      <div class="jeu-card-text-col">
        <div class="jeu-card-label">${esc(item.nom)}</div>
      </div>
    </div>
  </div>`;
}

function renderJeux() {
  const q = (document.getElementById('jeux-search')?.value || '').toLowerCase().trim();
  const body = document.getElementById('jeux-content');
  let html = '';
  let any = false;

  const section = (title, badgeIcon, list, statut, subtitle) => {
    if (!list.length) return;
    any = true;
    html += `<div class="jeux-section">
      <div class="jeux-section-head"><span class="jeux-section-title">${badgeIcon} ${title}</span><span class="jeux-section-badge">${list.length}</span></div>
      ${subtitle ? `<div class="jeux-section-sub">${subtitle}</div>` : ''}
      <div class="jeux-grid">${list.map(j => jeuCardHtml(j, statut)).join('')}</div>
    </div>`;
  };

  let enCours = _jeuxData.enCours;
  if (q) enCours = enCours.filter(j => j.nom.toLowerCase().includes(q));
  // Un jeu arrêté reste dans la même liste de données (toujours dans la
  // bibliothèque) mais ne compte plus comme "en cours" à l'affichage — sa
  // propre section, séparée. Pareil pour "à l'occasion" : sortie de "En
  // cours" pour sa propre section (voir plus bas), pas mélangée dedans.
  const aCompleter = enCours.filter(j => j.type === 'a_completer' && !j.arrete && !j.enPause);
  // Jeu du moment, puis Friday Fantasy, puis le reste (dont Exclu YouTube) —
  // tri stable, l'ordre relatif à l'intérieur de chaque groupe ne bouge pas.
  const enCoursPriority = j => j.jeuDuMoment ? 0 : (j.fridayFantasy ? 1 : 2);
  const normaux = enCours.filter(j => j.type !== 'a_completer' && !j.arrete && !j.occasion && !j.enPause).slice().sort((a, b) => enCoursPriority(a) - enCoursPriority(b));
  const occasionGames = enCours.filter(j => j.occasion && !j.arrete && !j.enPause);
  // « En pause » : jeux mis de côté pour un temps — leur propre section (et leur ruban), ni dans « En cours » ni dans « Histoire finie ».
  const enPauseGames = enCours.filter(j => j.enPause && !j.arrete);
  const arretes = enCours.filter(j => j.arrete);

  // Ordre voulu en haut de page : En cours, puis À venir, puis À l'occasion
  // — le reste (Histoire finie, Arrêtés, Terminés...) suit sans changer
  // d'ordre relatif entre eux.
  section('En cours', '🎯', normaux, 'enCours');

  let prochainement = _jeuxData.prochainement || [];
  if (q) prochainement = prochainement.filter(j => j.nom.toLowerCase().includes(q));
  if (prochainement.length) {
    any = true;
    html += `<div class="jeux-section">
      <div class="jeux-section-head"><span class="jeux-section-title">🔜 Prochainement en stream ou en vidéo</span><span class="jeux-section-badge">${prochainement.length}</span></div>
      <div class="jeux-grid">${prochainement.map(prochainementCardHtml).join('')}</div>
    </div>`;
  }

  section('À l\'occasion', '🎲', occasionGames, 'enCours');
  section('En pause', '⏸', enPauseGames, 'enCours');
  section('Histoire finie — à compléter', '✔', aCompleter, 'enCours');
  section('Arrêtés', '🛑', arretes, 'enCours');

  let termines = _jeuxData.termines;
  if (q) termines = termines.filter(j => j.nom.toLowerCase().includes(q));
  const annee = new Date().getFullYear();
  const cetteAnnee = termines.filter(j => j.annee && Number(j.annee) === annee);
  const archive = termines.filter(j => !j.annee || Number(j.annee) !== annee).slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  section(`Terminés en ${annee}`, '🗓', cetteAnnee, 'termines');
  section('Jeux terminés les années précédentes', '📚', archive, 'termines');

  body.innerHTML = any ? html : `<div class="jeux-empty">${q ? 'Aucun jeu ne correspond à ta recherche.' : 'Rien à afficher pour l\'instant.'}</div>`;
}

  if (prog.PlayStation) {
    const pct = calcPercentPS(prog.PlayStation);

    }
  }
  if (prog.PC && !ffxiv) {

    if (pct !== null) statsHtml += `<div class="jeu-detail-stat"><strong style="color:${platColor('PC')}">${pct}%</strong><span>Steam</span>${steamBadgeSpan(pct === 100 ? (prog.PC.steamState === 'full' ? 'full' : 'base') : (prog.PC.steamState === 'base' ? 'base' : 'none'))}</div>`;

  renderPublicGameRating(jeu);

  document.getElementById('modal-jeu-detail').classList.add('open');

    achHtml += `<div class="jeu-detail-section"><div class="jeu-detail-section-head">🎯 Succès Steam</div>${(ach.steamGroups && ach.steamGroups.length > 1) ? steamSetsHtml(ach.steam, ach.steamGroups) : achievementGridHtml(ach.steam, 'steam')}</div>`;

  }
  if (ach.switch && ach.switch.length) {
    achHtml += `<div class="jeu-detail-section"><div class="jeu-detail-section-head">🎮 Succès (via tâches)</div>${achievementGridHtml(ach.switch, 'switch')}</div>`;
  }
  if (!achHtml) achHtml = `<div class="jeu-detail-empty">Pas de détail de succès disponible pour ce jeu.</div>`;

  if (ffxiv) {
    body.innerHTML = `
      <div class="jeu-detail-tabs">
        <button class="jeu-detail-tab-btn active" onclick="switchJeuDetailTab('ingame', this)">🎮 In-game</button>
        <button class="jeu-detail-tab-btn" onclick="switchJeuDetailTab('succes', this)">🏆 Succès</button>
      </div>
      <div class="jeu-detail-tab-pane active" id="jeu-detail-tab-ingame"></div>

  } else if (isEsoGame(jeu.nom) && jeu.eso && jeu.eso.achievements) {
    body.innerHTML = `
      <div class="jeu-detail-tabs">
        <button class="jeu-detail-tab-btn active" onclick="switchJeuDetailTab('ingame', this)">🎮 In-game</button>
        <button class="jeu-detail-tab-btn" onclick="switchJeuDetailTab('succes', this)">🏆 Plateformes</button>
      </div>
      <div class="jeu-detail-tab-pane active" id="jeu-detail-tab-ingame">${esoIngameHtml(jeu.eso.achievements)}</div>
      <div class="jeu-detail-tab-pane" id="jeu-detail-tab-succes">${achHtml}</div>
    `;

// Onglet « In-game » d'Elder Scrolls Online — les succès INTERNES du jeu (addon en jeu), tout est déjà dans jeu.eso.achievements (résumé publié : progression, avancée par
// catégorie, derniers succès débloqués ; la liste complète des ~4000 succès reste dans l'éditeur local).
function esoIngameHtml(a) {
  const pct = a.total ? Math.round(a.earned / a.total * 100) : 0;
  const nombre = (n) => Number(n || 0).toLocaleString('fr-FR');
  const date = (ms) => ms ? new Date(ms).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const cats = (a.categories || []).slice().sort((x, y) => ((y.total ? y.earned / y.total : 0) - (x.total ? x.earned / x.total : 0)) || (y.total - x.total));
  const ligneCat = (c) => { const p = c.total ? Math.round(c.earned / c.total * 100) : 0; return `<div class="eso-cat"><span class="eso-cat-nom">${esc(c.name)}</span><div class="jeu-progress-bar"><div class="jeu-progress-fill" style="width:${p}%;background:${ESO_COLOR}"></div></div><span class="eso-cat-n">${nombre(c.earned)} / ${nombre(c.total)}</span></div>`; };
  const recents = (a.recent || []).map(r => `<div class="eso-recent"><span class="eso-recent-pts">${nombre(r.points)}</span><div><div class="eso-recent-nom">${esc(r.name)}</div>${r.description ? `<div class="eso-recent-desc">${esc(r.description)}</div>` : ''}</div><span class="eso-recent-date">${esc(date(r.date))}</span></div>`).join('');
  return `<div class="jeu-detail-section">
      <div class="jeu-detail-section-head">🏆 Succès du jeu</div>
      <div class="eso-resume"><strong>${pct}%</strong><span>${nombre(a.earned)} / ${nombre(a.total)} succès · ${nombre(a.earnedPoints)} / ${nombre(a.totalPoints)} points${a.characterName ? ' · ' + esc(a.characterName) : ''}</span></div>
      <div class="jeu-progress-bar eso-resume-bar"><div class="jeu-progress-fill" style="width:${pct}%;background:${ESO_COLOR}"></div></div>
    </div>
    <div class="jeu-detail-section"><div class="jeu-detail-section-head">📚 Par catégorie</div><div class="eso-cats">${cats.map(ligneCat).join('')}</div></div>
    ${recents ? `<div class="jeu-detail-section"><div class="jeu-detail-section-head">🕐 Derniers succès débloqués</div><div class="eso-recents">${recents}</div></div>` : ''}`;
}

function switchJeuDetailTab(tab, btn) {
  document.querySelectorAll('.jeu-detail-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.jeu-detail-tab-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const pane = document.getElementById('jeu-detail-tab-' + tab);
  if (pane) pane.classList.add('active');
}

const FFXIV_ROLE_ORDER = ['tank', 'healer', 'melee', 'ranged', 'caster', 'craft', 'gather'];
const FFXIV_ROLE_COLORS = { tank: '#3B82F6', healer: '#22C55E', melee: '#EF4444', ranged: '#F59E0B', caster: '#A855F7', craft: '#8B99A6', gather: '#8B99A6' };

let _ffxivActivePanel = null;
let _ffxivHfList = [];
let _ffxivCurrentData = null;

// Onglet "in-game" FFXIV — tout est déjà dans le JSON synchronisé
// (jeu.ffxiv), aucun appel réseau ici contrairement au panneau local.

        ${p.freeCompany ? `<span>🏠 ${esc(p.freeCompany)}</span>` : ''}
        ${d.updatedAt ? `<span style="opacity:.65">Mis à jour le ${new Date(d.updatedAt).toLocaleDateString('fr-FR')}</span>` : ''}
      </div>

    </div>
    ${(p.portrait || p.avatar) ? `<div class="ffxiv-banner-portrait">
      <img src="${esc(p.portrait || p.avatar)}" alt="">
      ${p.activeJobLevel ? `<div class="ffxiv-banner-active">
        <div class="ffxiv-banner-active-lvl">Niv. ${p.activeJobLevel}</div>

function ffxivMiniJobIconFallback(el, abbr) {
  const span = document.createElement('span');
  span.className = 'ffxiv-mini-job-fallback';
  span.textContent = abbr;
  el.replaceWith(span);
}

function ffxivMiniJobsHtml(d) {
  const combat = (d.jobs || []).filter(j => ['tank', 'healer', 'melee', 'ranged', 'caster'].includes(j.role));
  const crafting = (d.jobs || []).filter(j => ['craft', 'gather'].includes(j.role));
  const miniJob = j => `<div class="ffxiv-mini-job" title="${esc(j.abbr)} · niveau ${j.level || 0}">${j.icon ? `<img src="${esc(j.icon)}" alt="${esc(j.abbr)}" onerror="ffxivMiniJobIconFallback(this, ${esc(JSON.stringify(j.abbr))})">` : `<span class="ffxiv-mini-job-fallback">${esc(j.abbr)}</span>`}<span>${j.level || '—'}</span></div>`;
  let special = '';
  if (d.eureka) special += `<div class="ffxiv-mini-job" title="Eureka · niveau ${d.eureka.level}">${d.eureka.icon ? `<img src="${esc(d.eureka.icon)}" alt="Eureka" onerror="ffxivMiniJobIconFallback(this, 'EU')">` : `<span class="ffxiv-mini-job-fallback" style="color:var(--go)">EU</span>`}<span>${d.eureka.level}</span></div>`;
  if (d.bozja) special += `<div class="ffxiv-mini-job" title="Bozja · niveau ${d.bozja.level}">${d.bozja.icon ? `<img src="${esc(d.bozja.icon)}" alt="Bozja" onerror="ffxivMiniJobIconFallback(this, 'BZ')">` : `<span class="ffxiv-mini-job-fallback" style="color:var(--go)">BZ</span>`}<span>${d.bozja.level}</span></div>`;
  if (d.lunule) special += `<div class="ffxiv-mini-job" title="Île de Lunule · niveau de savoir ${d.lunule.level}">${d.lunule.icon ? `<img src="${esc(d.lunule.icon)}" alt="Lunule" onerror="ffxivMiniJobIconFallback(this, '🌙')">` : `<span class="ffxiv-mini-job-fallback" style="color:var(--go)">🌙</span>`}<span>${d.lunule.level}</span></div>`;
  return `<div class="ffxiv-banner-jobs">
    <div class="ffxiv-banner-jobs-row">${combat.map(miniJob).join('')}</div>
    <div class="ffxiv-banner-jobs-row">${crafting.map(miniJob).join('')}${special}</div>
  </div>`;

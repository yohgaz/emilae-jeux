<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning — emilae_tv</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0D14;--c1:#14161F;--c2:#191C27;--c3:#1F2230;--cy:#F0653D;--mt:#6FDA9A;--go:#E8B84D;--tx:#F4F2ED;--mu:#A6A29B;--br:rgba(255,255,255,.16);
  --glass-fill:rgba(255,255,255,.06);
  --glass-fill-strong:rgba(255,255,255,.10);
  --glass-border:rgba(255,255,255,.14);
  --glass-highlight:rgba(255,255,255,.3);
  --blur:24px;
  --radius-lg:26px;--radius-md:16px;--radius-sm:10px}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:0;position:relative;overflow-x:hidden}

body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none}
body::before{width:520px;height:520px;background:rgba(240,101,61,.10);top:-200px;left:-160px;animation:glass-drift1 34s ease-in-out infinite}
body::after{width:460px;height:460px;background:rgba(91,75,138,.16);bottom:-220px;right:-180px;animation:glass-drift2 30s ease-in-out infinite}
@keyframes glass-drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,50px)}}
@keyframes glass-drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-40px)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}

.page{position:relative;z-index:1;width:90%;max-width:1100px;margin:0 auto;padding:32px 0 60px}

.site-header{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:28px}
.site-title{font-size:19px;font-weight:900}
.site-updated{font-size:11.5px;color:var(--mu);margin-top:6px}
.back-link{font-size:13px;font-weight:800;color:var(--tx);text-decoration:none;background:var(--glass-fill-strong);border:1px solid var(--glass-border);padding:9px 16px;border-radius:999px;transition:border-color .15s}
.back-link:hover{border-color:var(--cy)}

.week-group{margin-bottom:40px}
.week-title{font-weight:900;font-size:17px;color:var(--cy);text-transform:capitalize;margin-bottom:18px}

.day-group{margin-bottom:26px}
.day-title{font-weight:900;font-size:14px;text-transform:capitalize;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.day-title::after{content:'';flex:1;height:1px;background:var(--glass-border)}

.events-row{display:flex;flex-wrap:wrap;gap:14px}

.event-card{display:flex;align-items:center;gap:14px;width:100%;max-width:420px;padding:14px 18px 14px 16px;background:var(--glass-fill);border:1px solid var(--glass-border);border-left:4px solid var(--evt-color, var(--cy));border-radius:var(--radius-md);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);box-shadow:inset 0 1px 0 var(--glass-highlight),0 10px 30px rgba(0,0,0,.3)}
.event-cover{flex-shrink:0;width:50px;height:50px;border-radius:10px;overflow:hidden;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:22px}
.event-cover img{width:100%;height:100%;object-fit:cover;display:block}
.event-info{min-width:0;flex:1}
.event-kind{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--evt-color, var(--cy));margin-bottom:3px}
.event-kind svg{width:13px;height:13px;flex-shrink:0}
.event-title{font-size:14.5px;font-weight:800;color:var(--tx);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-time{font-size:11.5px;color:var(--mu);margin-top:2px;font-family:monospace}

.empty-state{color:var(--mu);font-size:13px;padding:40px 16px;text-align:center;border:1.5px dashed var(--glass-border);border-radius:var(--radius-md)}
</style>
</head>
<body>

<div class="page">
  <div class="site-header">
    <div>
      <div class="site-title">📅 Planning — streams &amp; vidéos</div>
      <div class="site-updated" id="site-updated"></div>
    </div>
    <a class="back-link" href="/">🎮 Voir la bibliothèque de jeux</a>
  </div>

  <div id="planning-content"><div class="empty-state">Chargement…</div></div>
</div>

<script>
const TWITCH_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>';
const YOUTUBE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>';

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 3 rendus visuels distincts, mêmes que le panneau admin et le PNG du
// digest hebdomadaire (js/planning-cron.js) : Live Twitch / Rediff Twitch
// sur YouTube (chaîne principale) / Exclu YouTube (2e chaîne).
function eventKindInfo(e) {
  if (e.type === 'twitch_live') return { label: 'Live Twitch', color: '#9146FF', icon: TWITCH_SVG };
  if (e.channel === 'main') return { label: 'Rediff Twitch · @emilae_tv', color: '#FF0000', icon: YOUTUBE_SVG };
  return { label: 'Exclu YouTube · @etpourquoipasg', color: '#B77CFF', icon: YOUTUBE_SVG };
}

// Un jeu peut ne pas avoir de capsule Steam valide (404) alors que sa
// jaquette IGDB existe — on essaie donc CHAQUE candidat de gameCovers dans
// l'ordre plutôt que de s'arrêter au premier (même repli que côté panneau
// admin, coverImgFallback dans tasks-editor.html).
function coverFallback(img) {
  let remaining = [];
  try { remaining = JSON.parse(img.dataset.coverCandidates || '[]'); } catch (e) {}
  if (remaining.length) {
    img.src = remaining.shift();
    img.dataset.coverCandidates = JSON.stringify(remaining);
  } else {
    const parent = img.parentElement;
    img.remove();
    if (parent) parent.textContent = '🎮';
  }
}
function eventCard(e) {
  const kind = eventKindInfo(e);
  const covers = (e.gameCovers || []).slice();
  const firstCover = covers.shift() || null;
  const title = e.gameNom || e.title || (e.type === 'twitch_live' ? 'Live' : 'Vidéo');
  return `<div class="event-card" style="--evt-color:${kind.color}">
    <div class="event-cover">${firstCover ? `<img src="${escapeHtml(firstCover)}" data-cover-candidates='${escapeHtml(JSON.stringify(covers))}' onerror="coverFallback(this)" alt="">` : '🎮'}</div>
    <div class="event-info">
      <div class="event-kind">${kind.icon}${escapeHtml(kind.label)}</div>
      <div class="event-title">${escapeHtml(title)}</div>
      ${e.time ? `<div class="event-time">${escapeHtml(e.time)}</div>` : ''}
    </div>
  </div>`;
}

function dayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

// Semaine lundi→dimanche (même règle que le panneau admin et
// js/planning-cron.js) — utilisée pour grouper et titrer chaque semaine
// quand plusieurs semaines sont planifiées à l'avance.
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dateKey(d) { const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function formatWeekRange(monday, sunday) {
  const sameMonth = monday.getMonth() === sunday.getMonth() && monday.getFullYear() === sunday.getFullYear();
  const sameYear = monday.getFullYear() === sunday.getFullYear();
  if (sameMonth) return `du ${monday.getDate()} au ${sunday.getDate()} ${MOIS[sunday.getMonth()]} ${sunday.getFullYear()}`;
  if (sameYear) return `du ${monday.getDate()} ${MOIS[monday.getMonth()]} au ${sunday.getDate()} ${MOIS[sunday.getMonth()]} ${sunday.getFullYear()}`;
  return `du ${monday.getDate()} ${MOIS[monday.getMonth()]} ${monday.getFullYear()} au ${sunday.getDate()} ${MOIS[sunday.getMonth()]} ${sunday.getFullYear()}`;
}

function render(events) {
  const el = document.getElementById('planning-content');
  if (!events.length) { el.innerHTML = '<div class="empty-state">Rien de prévu pour le moment — reviens bientôt !</div>'; return; }

  const byWeek = {};
  events.forEach(e => {
    const monday = mondayOf(e.date);
    const key = dateKey(monday);
    (byWeek[key] = byWeek[key] || []).push(e);
  });
  const weekKeys = Object.keys(byWeek).sort();

  el.innerHTML = weekKeys.map(weekKey => {
    const monday = new Date(weekKey + 'T00:00:00');
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const byDate = {};
    byWeek[weekKey].forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
    const dates = Object.keys(byDate).sort();
    return `
      <div class="week-group">
        <div class="week-title">📅 Semaine ${formatWeekRange(monday, sunday)}</div>
        ${dates.map(date => `
          <div class="day-group">
            <div class="day-title">${escapeHtml(dayLabel(date))}</div>
            <div class="events-row">${byDate[date].map(eventCard).join('')}</div>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

(async function init() {
  try {
    const data = await fetch('./planning-public.json?t=' + Date.now()).then(r => r.json());
    render(data.events || []);
    if (data.publishedAt) {
      document.getElementById('site-updated').textContent = 'Mis à jour le ' + new Date(data.publishedAt).toLocaleString('fr-FR');
    }
  } catch (e) {
    document.getElementById('planning-content').innerHTML = '<div class="empty-state">Impossible de charger le planning pour le moment.</div>';
  }
})();
</script>
</body>
</html>
